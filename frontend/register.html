<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — API Documentation Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen">

    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-md border border-gray-700">
        <div class="flex flex-col items-center mb-6">
            <h1 class="text-2xl font-bold text-white mb-2">Создать аккаунт</h1>
            <p class="text-gray-400 text-sm">Присоединяйтесь к API Documentation Hub</p>
        </div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-gray-300 text-sm font-semibold mb-1">Имя пользователя</label>
                <input type="text" id="username" required 
                       class="w-full bg-gray-700 border border-gray-600 rounded p-2.5 text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-gray-300 text-sm font-semibold mb-1">Пароль</label>
                <input type="password" id="password" required minlength="6"
                       class="w-full bg-gray-700 border border-gray-600 rounded p-2.5 text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-gray-300 text-sm font-semibold mb-1">Подтвердите пароль</label>
                <input type="password" id="confirm_password" required minlength="6"
                       class="w-full bg-gray-700 border border-gray-600 rounded p-2.5 text-white focus:outline-none focus:border-indigo-500">
            </div>
            
            <div id="errorMessage" class="text-red-500 text-sm hidden"></div>
            <div id="successMessage" class="text-green-500 text-sm hidden">Аккаунт создан! Перенаправление...</div>

            <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-2.5 rounded transition duration-200 mt-2">
                Зарегистрироваться
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-400 text-sm">Уже есть аккаунт? 
                <a href="/login.html" class="text-indigo-400 hover:text-indigo-300 font-semibold transition">Войти</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const confirmPasswordInput = document.getElementById('confirm_password').value;
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            // Сбрасываем сообщения
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            // Проверка совпадения паролей
            if (passwordInput !== confirmPasswordInput) {
                errorDiv.innerText = 'Пароли не совпадают!';
                errorDiv.classList.remove('hidden');
                return;
            }

            // Формируем JSON объект (роль по умолчанию передаем как viewer)
            const payload = {
                username: usernameInput,
                password: passwordInput,
                role: "viewer"
            };

            try {
                // Отправляем JSON на бэкенд
                const response = await fetch('http://localhost:8080/api/v1/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    // Если успешно, показываем сообщение и через секунду кидаем на страницу входа
                    successDiv.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 1500);
                } else {
                    const errData = await response.json();
                    // Например: "Пользователь уже существует"
                    errorDiv.innerText = errData.detail || 'Ошибка при регистрации';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = 'Ошибка соединения с сервером';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>

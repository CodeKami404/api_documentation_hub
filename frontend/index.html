<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script>
        (function() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                // Если токена нет, мгновенно редиректим на страницу логина
                window.location.href = '/login.html';
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Documentation Hub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui.css" />
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:300,400,700" rel="stylesheet">
    
    <style>
        /* Стили Swagger (из прошлого шага) */
        .swagger-ui .topbar { display: none !important; }
        .dark .swagger-ui { filter: invert(88%) hue-rotate(180deg); } /* Быстрый хак для темной темы Swagger */
        
        /* Стили для ReDoc контейнера */
        #redoc-container { height: calc(100vh - 120px); overflow-y: auto; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 font-sans h-screen flex flex-col transition-colors duration-200">

    <nav class="bg-indigo-600 dark:bg-gray-800 text-white shadow-md z-20">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold flex items-center gap-2 cursor-pointer" onclick="showDashboard()">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 00-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                API Hub
            </div>
            
            <div class="flex items-center gap-4">
                <div id="view-toggle" class="hidden flex bg-indigo-700 dark:bg-gray-700 rounded-lg p-1">
                    <button id="btn-overview" onclick="setViewMode('overview')" class="px-3 py-1 text-xs font-bold rounded-md bg-white text-indigo-600 shadow-sm">Обзор</button>
                    <button id="btn-swagger" onclick="setViewMode('swagger')" class="px-3 py-1 text-xs font-bold rounded-md text-indigo-100 hover:text-white">Swagger</button>
                    <button id="btn-redoc" onclick="setViewMode('redoc')" class="px-3 py-1 text-xs font-bold rounded-md text-indigo-100 hover:text-white">ReDoc</button>
                </div>
                
                <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-indigo-500 dark:hover:bg-gray-700 transition">
                    <svg id="moon-icon" class="w-5 h-5 block dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    <svg id="sun-icon" class="w-5 h-5 hidden dark:block text-yellow-300" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path></svg>
                </button>

                <div class="flex items-center gap-3 border-l border-indigo-500 dark:border-gray-700 civil-profile pl-3">
                    <span id="userDisplay" class="text-sm font-medium text-indigo-100 dark:text-gray-300"></span>
                    <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 dark:bg-red-600 dark:hover:bg-red-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition shadow-sm">
                        Выйти
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main id="dashboard" class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <div class="flex justify-between items-end mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white">Реестр API</h1>
                <p class="text-gray-500 dark:text-gray-400 mt-1">Динамический список зарегистрированных систем</p>
            </div>
            <div id="adminActions" class="hidden">
                <button onclick="showMockModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition shadow-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Добавить Mock Сервис
                </button>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="servicesGrid">
            </div>
    </main>

    <!-- Модальное окно для создания мок сервиса -->
    <div id="mockModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 z-50 flex justify-center items-center">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 w-full max-w-md border border-gray-200 dark:border-gray-700">
            <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-4">Создать Mock Сервис</h2>
            <form id="mockForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-semibold mb-1">Название сервиса (англ, без пробелов)</label>
                    <input type="text" id="mockName" required placeholder="например: loyalty-service" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded p-2 text-gray-900 dark:text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-semibold mb-1">Версия</label>
                    <input type="text" id="mockVersion" required placeholder="1.0.0" value="1.0.0" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded p-2 text-gray-900 dark:text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-semibold mb-1">Описание</label>
                    <textarea id="mockDescription" rows="3" placeholder="Краткое описание заглушки" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded p-2 text-gray-900 dark:text-white focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <div id="mockError" class="text-red-500 text-sm hidden"></div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="hideMockModal()" class="px-4 py-2 text-gray-600 dark:text-gray-400 font-semibold hover:bg-gray-100 dark:hover:bg-gray-700 rounded transition">Отмена</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded transition shadow-sm">Создать</button>
                </div>
            </form>
        </div>
    </div>

    <div id="docs-wrapper" class="hidden flex-grow flex flex-col bg-white dark:bg-gray-900 w-full border-t border-gray-200 dark:border-gray-800">
        <div class="p-2 border-b border-gray-200 dark:border-gray-800 flex items-center gap-4">
            <button onclick="showDashboard()" class="text-gray-500 text-sm hover:text-indigo-600 font-semibold px-2 py-1 rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition">← Назад к списку</button>
        </div>
        
        <!-- КОНТЕЙНЕР ОБЗОРА -->
        <div id="overview-container" class="hidden flex-grow overflow-y-auto p-8 max-w-4xl mx-auto w-full">
            <div class="bg-indigo-50 dark:bg-gray-800 rounded-2xl p-8 mb-8 shadow-sm border border-indigo-100 dark:border-gray-700">
                <h2 id="ov-title" class="text-3xl font-extrabold text-indigo-900 dark:text-white mb-2">Загрузка...</h2>
                <div class="flex items-center gap-3 mb-6">
                    <span id="ov-version" class="bg-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-sm">v0.0.0</span>
                    <span class="text-gray-500 dark:text-gray-400 text-sm font-medium">OpenAPI <span id="ov-openapi">3.0.0</span></span>
                </div>
                <p id="ov-desc" class="text-gray-700 dark:text-gray-300 leading-relaxed text-lg"></p>
            </div>
            
            <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-4 flex items-center gap-2">
                <svg class="w-6 h-6 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Доступные эндпоинты
            </h3>
            <div id="ov-endpoints" class="space-y-3">
                <!-- Сюда JS вставит эндпоинты -->
            </div>
            
            <div class="mt-8 p-6 bg-gray-50 dark:bg-gray-800/50 rounded-xl border border-gray-200 dark:border-gray-700 text-center">
                <p class="text-gray-600 dark:text-gray-400 mb-4">Для детального изучения параметров запросов и ответов переключитесь в режим документации.</p>
                <button onclick="setViewMode('swagger')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg transition shadow-md">
                    Открыть Swagger UI
                </button>
            </div>
        </div>

        <div id="swagger-ui" class="hidden"></div>
        <div id="redoc-container" class="hidden"></div>
    </div>

    <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-bundle.js"></script>
    <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
    
    <script>
        let currentService = null;
        let currentMode = 'overview'; // По умолчанию теперь Обзор

        // === ЛОГИКА УРОВНЯ 2: ДИНАМИЧЕСКИЙ СПИСОК ===
        async function loadServices() {
            const token = localStorage.getItem('access_token');
            
            try {
                // Добавляем токен в заголовок запроса
                const response = await fetch('http://localhost:8080/api/v1/specifications/services', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                // Если бэкенд не пускает (токен устарел или удален) — на страницу входа
                if (response.status === 401) {
                    localStorage.removeItem('access_token');
                    window.location.href = '/login.html';
                    return;
                }

                const services = await response.json();
                const grid = document.getElementById('servicesGrid');
                grid.innerHTML = ''; 

                for (const service of services) {
                    let healthStatus = 'offline';
                    let healthColor = 'red';
                    try {
                        const healthRes = await fetch(`http://localhost:8080/api/v1/specifications/${service.name}/health`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const healthData = await healthRes.json();
                        healthStatus = healthData.status;
                        if (healthStatus === 'online') healthColor = 'green';
                    } catch (e) {
                        console.log(`Не удалось проверить статус ${service.name}`);
                    }

                    const versionOptions = service.versions.map(v => 
                        `<option value="${v}" ${v === service.latest_version ? 'selected' : ''}>${v}</option>`
                    ).join('');

                    const card = `
                        <div class="service-card bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 hover:shadow-md hover:border-indigo-300 dark:hover:border-indigo-500 transition">
                            <div class="flex justify-between items-start mb-4">
                                <h2 class="service-name text-lg font-bold text-gray-900 dark:text-white">${service.name}</h2>
                                <span class="bg-${healthColor}-100 dark:bg-${healthColor}-900 text-${healthColor}-800 dark:text-${healthColor}-300 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-${healthColor}-200 dark:border-${healthColor}-800">${healthStatus.toUpperCase()}</span>
                            </div>
                            <p class="text-gray-600 dark:text-gray-400 text-sm mb-2 h-10 line-clamp-2">${service.description}</p>
                            <div class="flex items-center gap-2 mb-4">
                                <label class="text-gray-400 dark:text-gray-500 text-xs font-medium">Версия:</label>
                                <select id="version-${service.name}" class="bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-xs rounded p-1 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                                    ${versionOptions}
                                </select>
                            </div>
                            <button onclick="openService('${service.name}')" class="text-indigo-600 dark:text-indigo-400 text-sm font-semibold flex items-center gap-1 group w-full text-left">
                                Открыть обзор сервиса
                                <svg class="w-4 h-4 transform group-hover:translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        </div>
                    `;
                    grid.innerHTML += card;
                }
            } catch (e) {
                console.error("Ошибка загрузки сервисов:", e);
                document.getElementById('servicesGrid').innerHTML = '<p class="text-red-500">Не удалось загрузить список сервисов. Проверьте подключение.</p>';
            }
        }

        let currentVersion = null;

        function openService(name) {
            currentService = name;
            currentVersion = document.getElementById(`version-${name}`).value;
            currentMode = 'overview'; // Всегда начинаем с обзора
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('docs-wrapper').classList.remove('hidden');
            document.getElementById('view-toggle').classList.remove('hidden');
            setViewMode('overview'); // Это вызовет renderDocs
        }

        function setViewMode(mode) {
            currentMode = mode;
            
            const btnActive = 'px-3 py-1 text-xs font-bold rounded-md bg-white text-indigo-600 shadow-sm transition';
            const btnInactive = 'px-3 py-1 text-xs font-bold rounded-md text-indigo-100 hover:text-white transition';
            
            document.getElementById('btn-overview').className = mode === 'overview' ? btnActive : btnInactive;
            document.getElementById('btn-swagger').className = mode === 'swagger' ? btnActive : btnInactive;
            document.getElementById('btn-redoc').className = mode === 'redoc' ? btnActive : btnInactive;
            
            renderDocs();
        }

        async function renderDocs() {
            const specUrl = currentVersion 
                ? `http://localhost:8080/api/v1/specifications/${currentService}/version/${currentVersion}`
                : `http://localhost:8080/api/v1/specifications/${currentService}/latest`;
                
            const overviewDiv = document.getElementById('overview-container');
            const swaggerDiv = document.getElementById('swagger-ui');
            const redocDiv = document.getElementById('redoc-container');

            // Скрываем все
            overviewDiv.classList.add('hidden');
            swaggerDiv.classList.add('hidden');
            redocDiv.classList.add('hidden');

            if (currentMode === 'overview') {
                overviewDiv.classList.remove('hidden');
                
                try {
                    const token = localStorage.getItem('access_token');
                    const res = await fetch(specUrl, { headers: { 'Authorization': `Bearer ${token}` } });
                    const spec = await res.json();
                    
                    document.getElementById('ov-title').innerText = spec.info.title || currentService;
                    document.getElementById('ov-version').innerText = 'v' + (spec.info.version || currentVersion);
                    document.getElementById('ov-openapi').innerText = spec.openapi || '3.0.0';
                    document.getElementById('ov-desc').innerText = spec.info.description || 'Описание отсутствует.';
                    
                    const epContainer = document.getElementById('ov-endpoints');
                    epContainer.innerHTML = '';
                    
                    if (spec.paths) {
                        for (const [path, methods] of Object.entries(spec.paths)) {
                            for (const [method, details] of Object.entries(methods)) {
                                let methodColor = 'gray';
                                if (method.toUpperCase() === 'GET') methodColor = 'blue';
                                if (method.toUpperCase() === 'POST') methodColor = 'green';
                                if (method.toUpperCase() === 'PUT' || method.toUpperCase() === 'PATCH') methodColor = 'yellow';
                                if (method.toUpperCase() === 'DELETE') methodColor = 'red';
                                
                                epContainer.innerHTML += `
                                    <div class="flex items-start gap-4 p-4 bg-white dark:bg-gray-800 rounded-lg border border-gray-100 dark:border-gray-700 shadow-sm hover:shadow-md transition">
                                        <div class="w-20 flex-shrink-0 mt-0.5">
                                            <span class="block text-center font-bold text-xs px-2 py-1 rounded bg-${methodColor}-100 text-${methodColor}-700 dark:bg-${methodColor}-900 dark:text-${methodColor}-300 uppercase">${method}</span>
                                        </div>
                                        <div class="flex-grow">
                                            <div class="font-mono text-sm font-semibold text-gray-800 dark:text-gray-200 mb-1 break-all">${path}</div>
                                            <div class="text-sm text-gray-600 dark:text-gray-400">${details.summary || ''}</div>
                                        </div>
                                    </div>
                                `;
                            }
                        }
                    }
                } catch (e) {
                    console.error("Failed to render overview", e);
                    document.getElementById('ov-title').innerText = "Ошибка загрузки данных";
                }
                
            } else if (currentMode === 'swagger') {
                swaggerDiv.classList.remove('hidden');
                SwaggerUIBundle({ 
                    url: specUrl, 
                    dom_id: '#swagger-ui', 
                    presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset], 
                    layout: "BaseLayout",
                    requestInterceptor: (req) => {
                        req.headers['Authorization'] = `Bearer ${localStorage.getItem('access_token')}`;
                        return req;
                    }
                });
            } else if (currentMode === 'redoc') {
                redocDiv.classList.remove('hidden');
                Redoc.init(specUrl, { theme: { colors: { primary: { main: '#4f46e5' } } } }, redocDiv);
            }
        }

        function showDashboard() {
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('docs-wrapper').classList.add('hidden');
            document.getElementById('view-toggle').classList.add('hidden');
        }

        function toggleDarkMode() { document.documentElement.classList.toggle('dark'); }

        // Логика кнопки выхода
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('access_token');
            window.location.href = '/login.html';
        });

        // Модальное окно и парсинг токена
        function parseJwt(token) {
            try {
                return JSON.parse(atob(token.split('.')[1]));
            } catch (e) {
                return null;
            }
        }

        function showMockModal() {
            document.getElementById('mockModal').classList.remove('hidden');
        }

        function hideMockModal() {
            document.getElementById('mockModal').classList.add('hidden');
            document.getElementById('mockError').classList.add('hidden');
            document.getElementById('mockForm').reset();
        }

        document.getElementById('mockForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('access_token');
            const name = document.getElementById('mockName').value.trim();
            const version = document.getElementById('mockVersion').value.trim();
            const desc = document.getElementById('mockDescription').value.trim();
            const errorDiv = document.getElementById('mockError');

            const spec = {
                openapi: "3.0.3",
                info: {
                    title: name + " API (Mock)",
                    version: version,
                    description: desc || "Mock service generated via UI."
                },
                paths: {
                    "/ping": {
                        get: {
                            summary: "Health Check",
                            responses: { "200": { description: "OK" } }
                        }
                    }
                }
            };

            try {
                const res = await fetch('http://localhost:8080/api/v1/specifications/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Service-Name': name,
                        'X-Service-Version': version,
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(spec)
                });

                if (res.ok) {
                    hideMockModal();
                    loadServices(); // Обновляем список
                } else {
                    const errData = await res.json();
                    errorDiv.innerText = errData.detail || 'Ошибка при создании';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = 'Ошибка соединения';
                errorDiv.classList.remove('hidden');
            }
        });

        window.onload = function() {
            // Извлекаем имя из localStorage и пишем в панель
            const username = localStorage.getItem('username') || 'Пользователь';
            document.getElementById('userDisplay').innerText = username;
            
            // Проверка роли
            const token = localStorage.getItem('access_token');
            const payload = parseJwt(token);
            if (payload && payload.role === 'admin') {
                document.getElementById('adminActions').classList.remove('hidden');
            }

            // Запускаем твою стандартную функцию загрузки карточек
            loadServices();
        };
    </script>
</body>
</html>

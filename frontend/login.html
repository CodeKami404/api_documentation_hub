<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — API Documentation Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen">

    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-md border border-gray-700">
        <div class="flex flex-col items-center mb-6">
            <h1 class="text-2xl font-bold text-white mb-2">API Documentation Hub</h1>
            <p class="text-gray-400 text-sm">Введите учетные данные для доступа к платформе</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-gray-300 text-sm font-semibold mb-1">Имя пользователя</label>
                <input type="text" id="username" required 
                       class="w-full bg-gray-700 border border-gray-600 rounded p-2.5 text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-gray-300 text-sm font-semibold mb-1">Пароль</label>
                <input type="password" id="password" required 
                       class="w-full bg-gray-700 border border-gray-600 rounded p-2.5 text-white focus:outline-none focus:border-indigo-500">
            </div>
            
            <div id="errorMessage" class="text-red-500 text-sm hidden"></div>

            <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-2.5 rounded transition duration-200">
                Войти в систему
            </button>
        </form> <div class="mt-6 text-center">
            <p class="text-gray-400 text-sm">Нет аккаунта? 
                <a href="/register.html" class="text-indigo-400 hover:text-indigo-300 font-semibold transition">Зарегистрироваться</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            // Преобразуем данные в формат x-www-form-urlencoded для FastAPI OAuth2
            const formData = new URLSearchParams();
            formData.append('username', usernameInput);
            formData.append('password', passwordInput);

            try {
                // Запрос к бэкенду на порт 8080
                const response = await fetch('http://localhost:8080/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    // Сохраняем JWT-токен в локальное хранилище браузера
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('username', usernameInput);
                    // Перенаправляем на главную страницу приложения
                    window.location.href = '/index.html';
                } else {
                    const errData = await response.json();
                    errorDiv.innerText = errData.detail || 'Неверное имя пользователя или пароль';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = 'Ошибка соединения с сервером авторизации';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
